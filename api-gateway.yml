server:
  port: ${SERVER_PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: conversion-service
              uri: lb://CONVERSION-SERVICE
              predicates:
                - name: Path
                  args:
                    pattern: /api/convert/**
              metadata:
                cors:
                  allowedOrigins: "*"
                  allowedMethods:
                    - GET
                    - POST
                    - PUT
                    - DELETE
                    - OPTIONS
                  allowedHeaders: "*"

            - id: processing-service
              uri: lb://PROCESSING-SERVICE
              predicates:
                - name: Path
                  args:
                    pattern: /api/process/**
              metadata:
                cors:
                  allowedOrigins: "*"
                  allowedMethods:
                    - GET
                    - POST
                    - PUT
                    - DELETE
                    - OPTIONS
                  allowedHeaders: "*"

            - id: metadata-service
              uri: lb://METADATA-SERVICE
              predicates:
                - name: Path
                  args:
                    pattern: /api/metadata/**
              metadata:
                cors:
                  allowedOrigins: "*"
                  allowedMethods:
                    - GET
                    - POST
                    - PUT
                    - DELETE
                    - OPTIONS
                  allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
