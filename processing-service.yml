server:
  port: ${SERVER_PORT:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

app:
  processing:
    ytdlp-path: ${YTDLP_PATH:yt-dlp}
    temp-dir: ${TEMP_DIR:/tmp/processing}
  storage:
    bucket-name: ${GCS_BUCKET_NAME}
    public-read: ${GCS_PUBLIC_READ:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
